apiVersion: 1

groups:
  - orgId: 1
    name: nexo-t42-alertas
    folder: NEXO
    interval: 1m
    rules:
      - uid: nexo-a1-consumo-duplicado
        title: "A1 — Consumo duplicado confirmado"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(nexo_c4_lotes_evidencia_total{resultado="conflicto"}[24h]))
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          nexo_metrica: N3
        annotations:
          summary: "Consumo duplicado o conflicto de integridad confirmado (idOrigen repetido con contenido distinto)."
          description: >-
            Objetivo cero (invariante #4, UNIQUE en D1). Detiene la prueba (T2 §8.6 A1). Proxy aplicativo
            disponible: conflictos de idempotencia en E1 (nexo_c4_lotes_evidencia_total{resultado=conflicto}).
            La verificación SQL definitiva de boletas con más de un consumo es responsabilidad de T55.

      - uid: nexo-a6-latencia-p95
        title: "A6 — Validaciones en ≤300 ms por debajo del 95 %"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum(rate(nexo_c2_validacion_duracion_ms_milliseconds_bucket{le="300"}[1m]))
                / sum(rate(nexo_c2_validacion_duracion_ms_milliseconds_count[1m]))
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.95] }
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: critical
          nexo_metrica: T1
        annotations:
          summary: "Menos del 95 % de las validaciones responden en 300 ms o menos."
          description: "SLO T1 (T2 §8.2/§8.6 A6): dos ventanas de 1 min por debajo de 95 %."

      - uid: nexo-a8-punto-sin-comunicacion
        title: "A8 — Punto sin comunicación más de 60 s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(nexo_c2_latido_edad_s) by (puntoId)
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [60] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          nexo_metrica: apoyo-KR1.2
        annotations:
          summary: "Un punto de control no envía latido H1 hace más de 60 s."
          description: "Apoyo de KR1.2 (T2 §8.6 A8); revisar conectividad del lector/punto {{ $labels.puntoId }}."

      - uid: nexo-a11-outbox-critico
        title: "A11 — Pendiente de outbox más antiguo crítico"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(nexo_c2_outbox_edad_maxima_s)
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          nexo_metrica: T2
        annotations:
          summary: "El registro pendiente más antiguo del outbox supera 300 s sin sincronizar con C4."
          description: "T2 §8.6 A11 (o recuperación < 99,5 % en 5 min, cubierta por el KR2.1 asociado a nexo_c2_outbox_pendientes)."

      - uid: nexo-a13-cola-collector-critica
        title: "A13 — Cola del Collector por encima del 80 %"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                otelcol_exporter_queue_size / otelcol_exporter_queue_capacity
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        noDataState: OK
        execErrState: OK
        for: 1m
        labels:
          severity: critical
          nexo_metrica: apoyo-8.4
        annotations:
          summary: "La cola persistente del Collector supera el 80 % de su capacidad."
          description: >-
            T2 §8.4/§8.6 A13. `execErrState: OK` porque el Collector puede estar apagado o sin la métrica
            interna habilitada sin que eso deba disparar esta alerta (T40: detener el Collector no bloquea
            validaciones).

      - uid: nexo-a14-exportacion-fallida
        title: "A14 — Telemetría descartada o exportación fallida"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum(increase(otelcol_exporter_send_failed_spans[5m]))
                + sum(increase(otelcol_exporter_send_failed_metric_points[5m]))
                + sum(increase(otelcol_exporter_send_failed_log_records[5m]))
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: OK
        for: 0s
        labels:
          severity: critical
          nexo_metrica: apoyo-8.4
        annotations:
          summary: "El Collector descartó telemetría o falló al exportarla a otel-lgtm/Grafana Cloud."
          description: "T2 §8.4/§8.6 A14, crítica operativa (no de negocio): revisar backlog y reintentos del Collector."

contactPoints:
  - orgId: 1
    name: nexo-webhook-local
    receivers:
      - uid: nexo-webhook-local-receiver
        type: webhook
        settings:
          url: "${NEXO_ALERT_WEBHOOK_URL}"
          httpMethod: POST

policies:
  - orgId: 1
    receiver: nexo-webhook-local
    group_by: ["alertname", "nexo_metrica"]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 15m
    routes:
      - receiver: nexo-webhook-local
        object_matchers:
          - ["severity", "=", "critical"]
        continue: false
