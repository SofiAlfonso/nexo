mode: deployment
namespaceOverride: nexo-observability
fullnameOverride: nexo-otel-collector

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  pullPolicy: IfNotPresent

command:
  name: otelcol-k8s

replicaCount: 1

rollout:
  strategy: Recreate

podSecurityContext:
  fsGroup: 10001

extraVolumes:
  - name: collector-storage
    persistentVolumeClaim:
      claimName: nexo-otel-collector-storage

extraVolumeMounts:
  - name: collector-storage
    mountPath: /var/lib/otelcol

additionalLabels:
  app.kubernetes.io/part-of: nexo

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

useGOMEMLIMIT: true

service:
  type: ClusterIP

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

config:
  extensions:
    file_storage:
      directory: /var/lib/otelcol/file_storage
      create_directory: true

  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      send_batch_size: 512
      timeout: 5s

  exporters:
    debug:
      verbosity: basic
    otlphttp/lgtm:
      endpoint: http://nexo-otel-lgtm.nexo-observability.svc.cluster.local:4318
      sending_queue:
        enabled: true
        storage: file_storage
        # Suficiente para varias decenas de minutos de lotes (traces+metrics+logs) sin backend
        # (F2, taller3 SS de resiliencia): con la cola persistida en file_storage, un queue_size
        # generoso no crece la memoria del proceso, solo el disco de la PVC.
        queue_size: 10000
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        # Sin limite: con sending_queue.storage=file_storage la cola persiste en la PVC
        # nexo-otel-collector-storage, asi que un backend caido no debe hacer que el exportador
        # descarte lotes por agotar max_elapsed_time. F2 (Collector aislado de otel-lgtm 15 min)
        # debe recuperar y reenviar todo sin perdida; se valida hasta 30+ min de outage.
        max_elapsed_time: 0

  service:
    extensions:
      - health_check
      - file_storage
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/lgtm
          - debug
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/lgtm
          - debug
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/lgtm
          - debug