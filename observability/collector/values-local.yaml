  
mode: deployment
namespaceOverride: nexo-observability
fullnameOverride: nexo-otel-collector

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  pullPolicy: IfNotPresent

command:
  name: otelcol-k8s

replicaCount: 1

additionalLabels:
  app.kubernetes.io/part-of: nexo

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

useGOMEMLIMIT: true

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

service:
  type: ClusterIP

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

extraEnvsFrom:
  - secretRef:
      name: grafana-cloud-otlp

extraVolumes:
  - name: collector-storage
    persistentVolumeClaim:
      claimName: nexo-otel-collector-storage

extraVolumeMounts:
  - name: collector-storage
    mountPath: /var/lib/otelcol

config:
  extensions:
    file_storage/nexo:
      directory: /var/lib/otelcol/queue
      timeout: 10s
      create_directory: true
      directory_permissions: "0750"

  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      send_batch_size: 512
      timeout: 5s

  exporters:
    debug:
      verbosity: basic

    otlp_http/grafana:
      endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
      headers:
        Authorization: ${env:GRAFANA_CLOUD_BASIC_AUTH_HEADER}
      compression: gzip
      timeout: 10s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 0s
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 1000
        storage: file_storage/nexo

  service:
    extensions:
      - health_check
      - file_storage/nexo

    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - otlp_http/grafana

      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - otlp_http/grafana

      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - otlp_http/grafana