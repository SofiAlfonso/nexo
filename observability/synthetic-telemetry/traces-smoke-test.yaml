apiVersion: batch/v1
kind: Job
metadata:
  name: nexo-traces-smoke-test
  namespace: nexo-observability
  labels:
    app.kubernetes.io/name: telemetrygen-traces
    app.kubernetes.io/component: synthetic-telemetry
    app.kubernetes.io/part-of: nexo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetrygen-traces
        app.kubernetes.io/component: synthetic-telemetry
        app.kubernetes.io/part-of: nexo
    spec:
      restartPolicy: Never
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          imagePullPolicy: IfNotPresent
          args:
            - traces
            - --otlp-endpoint=nexo-otel-collector:4317
            - --otlp-insecure
            - --duration=10s
            - --rate=1
            - --service=nexo-synthetic
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi