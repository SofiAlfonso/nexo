version: 1
id: ser-06-observability-outage
environment: minikube
owner: lab-operator
durationSeconds: 900
scope:
  event: lab-event-01
  gate: gate-01
  instance: venue-01
  synthetic: true
actions:
  - type: networkPolicy
    namespace: nexo-observability
    name: nexo-chaos-collector-egress
    podSelector:
      app.kubernetes.io/instance: nexo-otel-collector
      app.kubernetes.io/name: opentelemetry-collector
      component: standalone-collector
    mode: denyAll
