apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexo-alert-webhook
  namespace: nexo-observability
  labels:
    app.kubernetes.io/name: nexo-alert-webhook
    app.kubernetes.io/part-of: nexo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexo-alert-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexo-alert-webhook
        app.kubernetes.io/part-of: nexo
    spec:
      # Sin esto Kubernetes inyecta NEXO_ALERT_WEBHOOK_PORT=tcp://<ip>:9099 (enlace del
      # Service homónimo) y el receptor lo interpreta como puerto y termina con NaN.
      enableServiceLinks: false
      containers:
        - name: webhook-receptor
          image: node:24-alpine
          command: ["node", "/app/webhook-receptor.mjs"]
          ports:
            - name: http
              containerPort: 9099
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: nexo-alert-webhook-script
---
apiVersion: v1
kind: Service
metadata:
  name: nexo-alert-webhook
  namespace: nexo-observability
  labels:
    app.kubernetes.io/name: nexo-alert-webhook
    app.kubernetes.io/part-of: nexo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexo-alert-webhook
  ports:
    - name: http
      port: 9099
      targetPort: http
