apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexo-otel-lgtm
  namespace: nexo-observability
  labels:
    app.kubernetes.io/name: nexo-otel-lgtm
    app.kubernetes.io/part-of: nexo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nexo-otel-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexo-otel-lgtm
        app.kubernetes.io/part-of: nexo
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dashboards
              mountPath: /otel-lgtm/dashboards
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards
              readOnly: true
            - name: provisioning-alerting
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting
              readOnly: true
          env:
            - name: NEXO_ALERT_WEBHOOK_URL
              value: "http://nexo-alert-webhook:9099/alertas"
      volumes:
        - name: data
          emptyDir: {}
        - name: dashboards
          configMap:
            name: nexo-grafana-dashboards
        - name: provisioning-dashboards
          configMap:
            name: nexo-grafana-provisioning
            items:
              - key: nexo-dashboards.yaml
                path: nexo-dashboards.yaml
        - name: provisioning-alerting
          configMap:
            name: nexo-grafana-provisioning
            items:
              - key: nexo-alertas.yaml
                path: nexo-alertas.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: nexo-otel-lgtm
  namespace: nexo-observability
  labels:
    app.kubernetes.io/name: nexo-otel-lgtm
    app.kubernetes.io/part-of: nexo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexo-otel-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
