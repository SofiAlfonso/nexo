# Boletería simulada (nexo-external), sistema externo de prueba (P1).
# NOTA: `src/ticketing-sim/index.ts` es un stub (`export {};`) hasta que
# T23 lo complete (otra sesión); el Pod puede terminar en CrashLoopBackOff
# mientras tanto — no bloquea el criterio de aceptación de T26 (C2/C4/D1/D2
# y NetworkPolicies). Reconstruir la imagen tras T23 hace que sirva.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexo-ticketing
  namespace: nexo-external
  labels:
    app.kubernetes.io/name: nexo-ticketing
    app.kubernetes.io/part-of: nexo
    app.kubernetes.io/component: ticketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexo-ticketing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexo-ticketing
        app.kubernetes.io/part-of: nexo
        app.kubernetes.io/component: ticketing
    spec:
      containers:
        - name: nexo-ticketing
          image: nexo/ticketing-sim:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: HOST
              value: "0.0.0.0"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexo-ticketing
  namespace: nexo-external
  labels:
    app.kubernetes.io/name: nexo-ticketing
    app.kubernetes.io/part-of: nexo
spec:
  selector:
    app.kubernetes.io/name: nexo-ticketing
  ports:
    - name: http
      port: 8082
      targetPort: http
