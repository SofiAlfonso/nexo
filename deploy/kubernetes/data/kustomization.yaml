# Kustomize: capa de datos (D1 en nexo-venue, D2 en nexo-central).
# Los Secrets (nexo-d1-credentials, nexo-d2-credentials) los crea
# `deploy/scripts/up` antes de aplicar este directorio; no están aquí
# porque no deben versionarse en Git (AGENTS.md, invariante 8).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - d1-statefulset.yaml
  - d2-statefulset.yaml
