name: nexo-dev

services:
  d1:
    image: postgres:16-alpine
    ports:
      - "${D1_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${D1_POSTGRES_DB:-nexo_venue}"
      POSTGRES_USER: "${D1_POSTGRES_USER:-nexo_venue}"
      POSTGRES_PASSWORD: "${D1_POSTGRES_PASSWORD:-nexo_venue_dev}"
    volumes:
      - d1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  d2:
    image: postgres:16-alpine
    ports:
      - "${D2_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: "${D2_POSTGRES_DB:-nexo_central}"
      POSTGRES_USER: "${D2_POSTGRES_USER:-nexo_central}"
      POSTGRES_PASSWORD: "${D2_POSTGRES_PASSWORD:-nexo_central_dev}"
    volumes:
      - d2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:0.33.1
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3000:3000"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  d1-data:
  d2-data:
  lgtm-data:
